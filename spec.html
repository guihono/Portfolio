<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <h1><span>Header</span></h1>
        </header>

        <article id="text1">           
            <h3>Text side</h3>
            <h2>Subtitle</h2>
            <p>Paragraph 01 and 02</p>
        </article>
        <article id="text2">
            <h2>Subtitle</h2>
            <p>Paragraph 2 or 3 to match image 02 height</p>
        </article>

        <nav id="image1">
            <img src="Images/MoonImage.jpeg" alt="Image of a person on the moon" id="FirstImg">
            <ul>
                <li>Image description or bullet points</li>                
            </ul>
        </nav>
        <nav id="image2">
            <img src="Images/EarthImage.jpeg" alt="Image of the earth cut showing the core." id="SecondImg">
            <ul>
                <li>Image description or bullet points</li>
            </ul>
        </nav>

        <footer>
            <h4>More images and footer</h4>
        </footer>
    </div>
</body>

</html>
